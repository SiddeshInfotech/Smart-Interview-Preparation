version: '3.2'

services:
    api:
        image: ghcr.io/engineer-man/piston
        container_name: piston_api
        restart: always
        privileged: true
        ports:
            - 2000:2000
        environment:
            - PISTON_COMPILE_TIMEOUT=30000
            - PISTON_RUN_TIMEOUT=30000
            - PISTON_COMPILE_CPU_TIME=30000
            - PISTON_RUN_CPU_TIME=30000
        volumes:
            - ./piston/packages:/piston_api/packages
            - ./data:/piston/data
        tmpfs:
            - /tmp:exec