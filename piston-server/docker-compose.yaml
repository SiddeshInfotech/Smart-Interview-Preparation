version: '3.2'

services:
    api:
        image: ghcr.io/engineer-man/piston
        container_name: piston_api
        restart: always
        privileged: true
        ports:
            - 2000:2000
        volumes:
            - ./piston/packages:/piston_api/packages
            - ./data:/piston/data
        tmpfs:
            - /tmp:exec